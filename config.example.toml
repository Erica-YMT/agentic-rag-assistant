model_provider = "OpenAI"
model = "your-chat-model"

[model_providers.OpenAI]
api_key = "your-api-key"
base_url = "https://your-openai-compatible-endpoint/v1"
model = "your-chat-model"
timeout = 30.0
max_retries = 1

[embedding]
model_path = "/absolute/path/to/bge-small-zh-v1.5"
data_path = "data/knowledge/public"
index_path = "faiss_index"
top_k = 3
score_threshold = 1.0
chunk_size = 600
chunk_overlap = 100

[vector_store]
# faiss：本地轻量默认；milvus：生产/扩展后端。FAISS 索引仍保留作回退。
backend = "faiss"
fallback_to_faiss = true

[milvus]
uri = "http://127.0.0.1:19530"
collection_name = "agentic_rag_chunks"
metric_type = "COSINE"
timeout = 30.0
batch_size = 128

[api_client]
base_url = "http://127.0.0.1:8000"
timeout = 120.0

[reranker]
enabled = true
model = "BAAI/bge-reranker-base"
candidate_k = 10
top_k = 3
max_length = 512


[web_search]
enabled = true
api_key = ""
base_url = "https://open.bigmodel.cn/api/paas/v4/web_search"
search_engine = "search_std"
count = 5
timeout = 30.0
content_size = "medium"

[corrective_rag]
enabled = true
model = ""
max_context_chars = 6000
max_attempts = 2

[complex_rag]
enabled = true
model = ""
max_subquestions = 3
max_each_result_chars = 4500
max_merged_chars = 14000
simple_fast_path_max_chars = 32
max_attempts = 2

[hierarchical_chunking]
enabled = true
parent_chunk_size = 1200
parent_chunk_overlap = 120
child_chunk_size = 400
child_chunk_overlap = 80

[auto_merge]
enabled = true
min_child_hits = 2
merge_ratio = 0.5
max_parent_chars = 2400

[tool_reliability]
max_queue_size = 32
enqueue_timeout_seconds = 0.05
execution_timeout_seconds = 30.0
max_attempts = 2
retry_backoff_seconds = 0.25
rate_limit_per_second = 0.0
rate_limit_burst = 1
circuit_failure_threshold = 5
circuit_recovery_seconds = 30.0
dlq_max_size = 1000
