services:

  # AGENT_METRICS_SOURCE_MOUNTS_V1
  api:
    entrypoint: []
    env_file:
      - ./.langsmith.env
      - ./.db.env
    volumes:
      - ./app:/app/app:ro
      - ./api.py:/app/api.py:ro
      - ./build_index.py:/app/build_index.py:ro
      - ./rag:/app/rag:ro
      - ./scripts/build_milvus_shadow.py:/app/scripts/build_milvus_shadow.py:ro
      - ./scripts/milvus_search_test.py:/app/scripts/milvus_search_test.py:ro



  web:
    volumes:
      - ./web.html:/app/web.html:ro
      - ./web_server.py:/app/web_server.py:ro
      - ./api_client.py:/app/api_client.py:ro

  grafana:
    image: grafana/grafana:13.1.0

    depends_on:
      - prometheus

    ports:
      - "127.0.0.1:3600:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    restart: unless-stopped


volumes:
  grafana-data:
