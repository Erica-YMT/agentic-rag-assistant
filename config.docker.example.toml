model_provider = "OpenAI"
model = "gpt-5.6-sol"
review_model = "gpt-5.5"
model_reasoning_effort = "high"
disable_response_storage = true
network_access = "enabled"
windows_wsl_setup_acknowledged = true

[model_providers.OpenAI]
name = "OpenAI"
api_key = "your-api-key"
base_url = "https://vip.j3gb.com/v1"
model = "gpt-5.6-sol"
timeout = 60.0
max_retries = 0
wire_api = "responses"
requires_openai_auth = false

[features]
goals = true

[windows]
sandbox = "elevated"

[projects.'d:\workandstudy\code\python']
trust_level = "trusted"

[projects."/home/tammye_erica/ai"]
trust_level = "trusted"

[embedding]
model_path = "/models/bge-small-zh-v1.5"
data_path = "data/knowledge/public"
index_path = "faiss_index"
top_k = 3

[api_client]
base_url = "http://api:8000"
timeout = 120.0

[reranker]
enabled = false
model = "BAAI/bge-reranker-base"
candidate_k = 10
top_k = 3
max_length = 512




[web_search]
enabled = true
provider = "tavily"
api_key = "your-tavily-api-key"
base_url = "https://api.tavily.com/search"
search_depth = "basic"
max_results = 3
timeout = 30.0

[concurrency]
max_concurrent_chats = 2

[corrective_rag]
enabled = true
model = ""
max_context_chars = 6000
max_attempts = 2

[complex_rag]
enabled = true
model = ""
max_subquestions = 3
max_each_result_chars = 4500
max_merged_chars = 14000
simple_fast_path_max_chars = 32
max_attempts = 2

[hierarchical_chunking]
enabled = true
parent_chunk_size = 1200
parent_chunk_overlap = 120
child_chunk_size = 400
child_chunk_overlap = 80

[auto_merge]
enabled = true
min_child_hits = 2
merge_ratio = 0.5
max_parent_chars = 2400
